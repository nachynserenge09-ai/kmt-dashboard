<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Студенческий Дашборд</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #17212b);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #7f91a4);
            --button-color: var(--tg-theme-button-color, #5288c1);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #232e3c);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .card {
            background-color: var(--secondary-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .gpa-badge {
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
        }
        button {
            width: 100%;
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h2 id="user-name" style="margin: 0;">Привет, Студент!</h2>
            <span style="color: var(--hint-color); font-size: 14px;">Колледж • 2 курс</span>
        </div>
        <div style="text-align: right;">
            <div style="font-size: 12px; color: var(--hint-color);">Средний балл</div>
            <div class="gpa-badge">4.1</div>
        </div>
    </div>

    <div class="card">
        <h3 style="margin-top: 0;">Статус бэкенда</h3>
        <p id="server-status" style="color: var(--hint-color);">Загрузка данных с сервера...</p>
    </div>

    <button onclick="tg.close()">Закрыть приложение</button>

    <script>
        // Безопасная инициализация (работает и в браузере, и в Telegram)
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : {
            expand: () => {},
            close: () => alert('Закрытие доступно только в Telegram'),
            initDataUnsafe: {}
        };
        
        try {
            tg.expand();
        } catch (e) {
            console.log("WebApp expand error:", e);
        }

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-name').innerText = `Привет, ${tg.initDataUnsafe.user.first_name}!`;
        }

        // Запрос к нашему FastAPI бэкенду
        fetch('http://127.0.0.1:8000/api/status')
            .then(response => response.json())
            .then(data => {
                document.getElementById('server-status').innerText = data.message;
                document.getElementById('server-status').style.color = '#4CAF50';
            })
            .catch(error => {
                document.getElementById('server-status').innerText = 'Ошибка подключения к серверу';
                document.getElementById('server-status').style.color = '#ff5252';
            });
    </script>
</body>
</html>
